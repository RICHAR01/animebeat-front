<div id="animes-quality-deletion" class="modal">
  <div class="modal-content">
    <h5 class="thin center-align">¿Está seguro que desea eliminar la calidad '{{currentQuality}}'?</h5>
    Realizar esta acción eliminará todas las descargar de los episodios con esta calidad.
  </div>
  <div class="modal-footer">
      <a ng-click="deleteQuality()" class="modal-action waves-effect waves-light btn blue">Aceptar</a>
      <a class="modal-action modal-close waves-effect waves-light btn-flat">Cancelar</a>
  </div>
</div>
