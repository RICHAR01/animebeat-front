<div class="searcher">
  <nav>
    <div class="nav-wrapper">
      <form>
        <div class="input-field">
          <input id="searcher" 
                 type="search" 
                 placeholder="{{placeholder}}"
                 ng-model="query"
                 ng-change="changeSearchQuery(query)"/>
          <label for="searcher"><i class="material-icons">search</i></label>
          <i class="material-icons"
             ng-click="clearSearch()">close</i>
        </div>
      </form>
    </div>
  </nav>
</div>
