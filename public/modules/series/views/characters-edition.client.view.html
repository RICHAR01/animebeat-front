<!-- Nota-Todo: Aqui se usaron la mismas clases que en episodes-edition -->
<div class="row episodes-edition">

  <div class="container">

    <div class="col s12 header">
      <a ng-href="#!/admin/series">
        <i class="material-icons">arrow_back</i>
      </a>
      <div class="title">{{serieName}}</div>
      <div class="link">
        <a ng-href="#!/admin/series/{{serieId}}">IR A DATOS DEL ANIME</a>
      </div>
    </div>

    <div class="col s12 block-sliced">

      <div class="col s12 title-container divisor">
        <div class="title-box">
          <i class="material-icons">subscriptions</i>
          <div class="title">Personajs</div>
        </div>

        <div class="add-episode-box"
             ng-click="onAddOrUpdateCharacter()">
          <i class="material-icons">add_circle</i>
          <div class="title hide-on-small-only">Agregar</div>
        </div>
      </div>

      <div class="col s12 main-content">

        <!-- personajes -->
        <div class="col s12 m4 l2 episode-container" ng-repeat="character in characters" ng-if="characters.length">
          <character character="character"></character>
          <div class="col s12 options">
            <a class="btn-floating btn-flat waves-effect waves-light option"
               ng-click="onDeleteCharacter(character, $index)"
               tooltipped
               data-position="bottom"
               data-tooltip="Eliminar">
              <i class="material-icons">delete</i>
            </a>
            <a class="btn-floating btn-flat waves-effect waves-light option"
               ng-click="onAddOrUpdateCharacter(character)"
               tooltipped
               data-position="bottom"
               data-tooltip="Editar">
              <i class="material-icons">edit</i>
            </a>
          </div>
        </div>

        <div class="col s12" ng-if="!characters.length">
          <!-- TODO: Poner nuevo mensaje con icono -->
          <message-with-icon 
            icon-class="material-icons" 
            icon-text="mood" 
            title="Actualmente no se cuenta con personajes registrados." 
            message="Si deseas agregar personajes, usa el boton agregar.">
          </message-with-icon>
        </div>

      </div>

    </div>

  </div>

</div>

<div ng-include="'/modules/series/views/character-edition-modal.client.view.html'"></div>
<div ng-include="'/modules/series/views/character-deletion-modal.client.view.html'"></div>
