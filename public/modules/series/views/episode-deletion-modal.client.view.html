<div id="episode-deletion-modal" class="modal">
  <div class="modal-content row no-margin">
    <h5>Eliminar episodio</h5>
    
    <div class="col s12 no-padding">
      ¿Está seguro que desea eliminar el episodio seleccionado?
    </div>
  </div>
  <div class="modal-footer">
    <a class="modal-action waves-effect waves-green btn-flat"
       ng-click="deleteEpisode()">Eliminar</a>
    <a class="modal-action modal-close waves-effect waves-green btn-flat">Cancelar</a>
  </div>
</div>
